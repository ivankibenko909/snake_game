<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Змейка - Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #4a148c 50%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #4ade80, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .score-board {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .score-item {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .score-item.high {
            border-color: rgba(250, 204, 21, 0.3);
        }

        .score-label {
            color: #4ade80;
            font-weight: 600;
        }

        .score-item.high .score-label {
            color: #facc15;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .game-container {
            position: relative;
            border: 2px solid rgba(74, 222, 128, 0.5);
            border-radius: 8px;
            background: rgba(15, 15, 30, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
        }

        canvas {
            display: block;
            border-radius: 6px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .overlay p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .overlay .game-over-text {
            color: #f87171;
        }

        .overlay .ready-text {
            color: #4ade80;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(to right, #22c55e, #059669);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #4ade80, #10b981);
        }

        .hint {
            color: #9ca3af;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .controls-info {
            margin-top: 15px;
            color: #9ca3af;
            font-size: 0.85rem;
            text-align: center;
        }

        .controls-info span {
            color: #4ade80;
        }

        .pause-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(55, 65, 81, 0.5);
            color: #d1d5db;
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .pause-btn:hover {
            background: rgba(75, 85, 99, 0.5);
        }

        /* Мобильное управление */
        .mobile-controls {
            display: none;
            margin-top: 20px;
        }

        .mobile-controls .grid {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            gap: 8px;
            justify-content: center;
        }

        .mobile-btn {
            width: 48px;
            height: 48px;
            background: rgba(55, 65, 81, 0.8);
            border: 1px solid rgba(75, 85, 99, 0.6);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-btn:active {
            background: rgba(34, 197, 94, 0.6);
        }

        .mobile-btn.pause-mobile {
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: block;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>🐍 Змейка</h1>

    <div class="score-board">
        <div class="score-item">
            <span class="score-label">Счёт: </span>
            <span class="score-value" id="score">0</span>
        </div>
        <div class="score-item high">
            <span class="score-label">Рекорд: </span>
            <span class="score-value" id="highScore">0</span>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Стартовый экран -->
        <div class="overlay" id="startOverlay">
            <h2 class="ready-text">Готовы играть?</h2>
            <button class="btn" id="startBtn">Начать игру</button>
            <p class="hint">или нажмите Пробел</p>
        </div>

        <!-- Экран Game Over -->
        <div class="overlay hidden" id="gameOverOverlay">
            <h2 class="game-over-text">Игра окончена!</h2>
            <p>Счёт: <span id="finalScore">0</span></p>
            <button class="btn" id="restartBtn">Играть снова</button>
            <p class="hint">или нажмите Пробел</p>
        </div>

        <!-- Экран паузы -->
        <div class="overlay hidden" id="pauseOverlay">
            <h2 style="color: #facc15;">⏸ Пауза</h2>
        </div>
    </div>

    <button class="pause-btn" id="pauseBtn" style="display:none;">⏸ Пауза</button>

    <div class="controls-info">
        Управление: <span>WASD</span> или <span>стрелки</span> | Пауза: <span>Пробел</span>
    </div>

    <!-- Мобильное управление -->
    <div class="mobile-controls">
        <div class="grid">
            <div></div>
            <div class="mobile-btn" data-dir="UP">↑</div>
            <div></div>
            <div class="mobile-btn" data-dir="LEFT">←</div>
            <div class="mobile-btn pause-mobile" id="mobilePauseBtn">⏸</div>
            <div class="mobile-btn" data-dir="RIGHT">→</div>
            <div></div>
            <div class="mobile-btn" data-dir="DOWN">↓</div>
            <div></div>
        </div>
    </div>

    <script>
        // ===== НАСТРОЙКИ ИГРЫ =====
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const INITIAL_SPEED = 150;

        // ===== ПЕРЕМЕННЫЕ СОСТОЯНИЯ =====
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
        let gameRunning = false;
        let gamePaused = false;
        let gameOver = false;
        let speed = INITIAL_SPEED;
        let gameLoop = null;

        // ===== ЭЛЕМЕНТЫ DOM =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const pauseBtn = document.getElementById('pauseBtn');

        // Инициализация рекорда
        highScoreEl.textContent = highScore;

        // ===== ФУНКЦИИ ИГРЫ =====

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            return newFood;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = generateFood();
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            speed = INITIAL_SPEED;
            gameOver = false;
            gamePaused = false;
            scoreEl.textContent = '0';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            pauseBtn.style.display = 'block';
            gameRunning = true;
            startGameLoop();
        }

        function startGameLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function update() {
            if (!gameRunning || gamePaused || gameOver) return;

            direction = nextDirection;

            // Новая голова
            const head = { ...snake[0] };
            switch (direction) {
                case 'UP': head.y--; break;
                case 'DOWN': head.y++; break;
                case 'LEFT': head.x--; break;
                case 'RIGHT': head.x++; break;
            }

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                endGame();
                return;
            }

            // Проверка столкновения с собой
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Проверка еды
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore.toString());
                }
                food = generateFood();
                // Ускорение
                speed = Math.max(50, speed - 3);
                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            } else {
                snake.pop();
            }

            draw();
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
            pauseBtn.style.display = 'none';
        }

        function togglePause() {
            if (!gameRunning || gameOver) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                pauseOverlay.classList.remove('hidden');
                pauseBtn.textContent = '▶ Продолжить';
            } else {
                pauseOverlay.classList.add('hidden');
                pauseBtn.textContent = '⏸ Пауза';
            }
        }

        // ===== ОТРИСОВКА =====

        function draw() {
            // Очистка
            ctx.fillStyle = 'rgba(15, 15, 30, 0.95)';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Сетка (тонкая)
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }

            // Еда
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Змейка
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Голова
                    ctx.fillStyle = '#4ade80';
                    ctx.shadowColor = '#4ade80';
                    ctx.shadowBlur = 8;
                } else {
                    // Тело
                    const alpha = 1 - (index / snake.length) * 0.4;
                    ctx.fillStyle = `rgba(34, 197, 94, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                const x = segment.x * CELL_SIZE + 1;
                const y = segment.y * CELL_SIZE + 1;
                const size = CELL_SIZE - 2;

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 3);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
        }

        // Начальная отрисовка
        draw();

        // ===== УПРАВЛЕНИЕ =====

        document.addEventListener('keydown', (e) => {
            // Пробел
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (gameOver) {
                    resetGame();
                } else if (!gameRunning) {
                    resetGame();
                } else {
                    togglePause();
                }
                return;
            }

            if (!gameRunning || gameOver || gamePaused) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    if (direction !== 'DOWN') nextDirection = 'UP';
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    if (direction !== 'UP') nextDirection = 'DOWN';
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    if (direction !== 'RIGHT') nextDirection = 'LEFT';
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    if (direction !== 'LEFT') nextDirection = 'RIGHT';
                    break;
            }
        });

        // Кнопки
        document.getElementById('startBtn').addEventListener('click', resetGame);
        document.getElementById('restartBtn').addEventListener('click', resetGame);
        pauseBtn.addEventListener('click', togglePause);

        // Мобильные кнопки
        document.querySelectorAll('.mobile-btn[data-dir]').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.dataset.dir;
                if (!gameRunning || gameOver || gamePaused) return;
                if (dir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
                if (dir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
                if (dir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
                if (dir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
            });
            btn.addEventListener('click', () => {
                const dir = btn.dataset.dir;
                if (!gameRunning || gameOver || gamePaused) return;
                if (dir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
                if (dir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
                if (dir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
                if (dir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
            });
        });

        document.getElementById('mobilePauseBtn').addEventListener('click', togglePause);
        document.getElementById('mobilePauseBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            togglePause();
        });
    </script>
</body>
</html>
